[project]
name = "docshealth-backend"
version = "0.1.0"
description = "Docs Health - AI scheduling & patient email automation platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "cryptography>=43",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "aiosmtpd>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
